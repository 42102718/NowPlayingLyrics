<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hummi 點歌單</title>
<!--
  OBS 用的點歌單 (透明背景)。網址參數：
    ?n=3        顯示接下來幾首 (0 = 不顯示)
    ?count=0    不顯示「今天唱了幾首」
    ?hint=0     不顯示「聊天室打 !點歌 歌名」
    ?side=right 靠右對齊
    ?scale=1.2  整個放大
    ?bg=0       不要底色 (只有字和陰影)
    ?style=bar    細長的一條：唱歌時也一直在，觀眾隨時看得到自己的歌排第幾首。
                  來源的高度設小 (例如 1600×70) 就整條填滿來源，在 OBS 裡想放哪就拖到哪；來源很大時預設貼在下方 (?pos=top 改到上方)
    ?style=board  大看板：正在唱 + 接下來最多 8 首 + 怎麼點歌，填滿整個來源 (建議 600×900 放在畫面一側)
-->
<style>
:root{--accent:#b9a6ff;--font:"Inter","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;--s:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased}
#card{position:fixed;left:24px;top:24px;width:min(460px,calc(100vw - 48px));transform-origin:top left;transform:scale(var(--s));
  padding:16px 18px 14px;border-radius:20px;background:linear-gradient(180deg,rgba(18,16,28,.72),rgba(18,16,28,.58));
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 20px 50px -18px rgba(0,0,0,.6);backdrop-filter:blur(20px)}
body.right #card{left:auto;right:24px;transform-origin:top right}
#card{transition:opacity .6s ease,translate .6s cubic-bezier(.2,.9,.25,1)}
#card.away{opacity:0;translate:0 -12px;pointer-events:none}
body.nobg #card{background:none;border:0;box-shadow:none;backdrop-filter:none}
body.nobg *{text-shadow:0 2px 8px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9)}
.lbl{font:700 12px var(--font);letter-spacing:.12em;color:var(--accent);display:flex;align-items:center;gap:8px}
.lbl .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#now{margin:6px 0 2px}
#now .t{font:800 26px/1.2 var(--font);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#now .u{font:600 13px var(--font);color:rgba(255,255,255,.7);margin-top:2px}
#now.enter .t,#now.enter .u{animation:rise .7s cubic-bezier(.2,.9,.25,1.1)}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(4px)}}
#next{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
#next ol{list-style:none;display:flex;flex-direction:column;gap:5px;margin-top:6px}
#next li{display:flex;gap:10px;align-items:baseline;font:600 15px var(--font);white-space:nowrap;overflow:hidden}
#next li i{font-style:normal;flex:none;width:18px;color:rgba(255,255,255,.45);font-variant-numeric:tabular-nums}
#next li span{overflow:hidden;text-overflow:ellipsis}
#next li small{flex:none;font:500 12px var(--font);color:rgba(255,255,255,.55)}
#foot{display:flex;align-items:center;gap:10px;margin-top:12px;font:600 12.5px var(--font);color:rgba(255,255,255,.75)}
#count{display:flex;align-items:baseline;gap:6px}
#count b{font:800 20px var(--font);color:#fff;font-variant-numeric:tabular-nums}
#count b.bump{animation:bump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.5);color:var(--accent)}}
#hint{margin-left:auto;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.65)}
#hint code{font:700 12.5px var(--font);color:var(--accent)}
.empty{font:600 15px var(--font);color:rgba(255,255,255,.6);margin-top:6px}
[hidden]{display:none!important}
/* ═════ 細長條 (?style=bar)：一直在畫面下方，觀眾看得到自己的歌排第幾 ═════ */
#bar{position:fixed;left:24px;right:24px;bottom:20px;display:none;align-items:center;gap:14px;height:44px;padding:0 8px 0 16px;border-radius:22px;
  transform-origin:bottom center;transform:scale(var(--s));background:linear-gradient(180deg,rgba(18,16,28,.7),rgba(18,16,28,.56));
  border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 14px 36px -14px rgba(0,0,0,.6);backdrop-filter:blur(18px);
  font:600 15px var(--font);white-space:nowrap;transition:opacity .6s,translate .6s cubic-bezier(.2,.9,.25,1)}
body.style-bar #bar{display:flex}
body.style-bar.top #bar{top:20px;bottom:auto}
/* 來源設得很矮：整條填滿來源，在 OBS 裡自己拖位置 */
body.style-bar.fill #bar{left:2px;right:2px;top:50%;bottom:auto;translate:0 -50%;height:calc(100vh - 6px);max-height:64px;border-radius:999px;transform:none;font-size:clamp(13px,40vh,18px)}
body.style-bar.fill #bar.away{translate:0 -50%}
/* ═════ 大看板 (?style=board)：填滿整個來源 ═════ */
body.style-board #card{inset:12px;width:auto;transform:none;display:flex;flex-direction:column;padding:26px 28px 22px;border-radius:28px}
body.style-board .lbl{font-size:13px}
body.style-board #now{margin:10px 0 4px}
body.style-board #now .t{font-size:clamp(26px,7vw,46px);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
body.style-board #now .u{font-size:clamp(13px,2.4vw,17px);margin-top:6px}
body.style-board #next{flex:1;min-height:0;overflow:hidden;margin-top:18px;padding-top:16px}
body.style-board #next ol{gap:0}
body.style-board #next li{font-size:clamp(16px,3.6vw,24px);padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.08)}
body.style-board #next li i{width:34px;color:var(--accent)}
body.style-board #next li small{font-size:clamp(12px,2.4vw,15px);margin-left:auto;padding-left:12px}
body.style-board #foot{margin-top:16px;font-size:14px}
body.style-board #count b{font-size:26px}
body.style-board #hint{font-size:13.5px;padding:6px 14px}
body.style-board .empty{font-size:clamp(16px,3vw,22px)}
body.style-bar #card{display:none}
body.nobg #bar{background:none;border:0;box-shadow:none;backdrop-filter:none}
#bar.away{opacity:0;translate:0 12px}
#bar .now{flex:none;display:flex;align-items:center;gap:8px;max-width:38%}
#bar .now .k{font:700 12px var(--font);letter-spacing:.1em;color:var(--accent)}
#bar .now .t{overflow:hidden;text-overflow:ellipsis}
#bar .now .u{font:500 12.5px var(--font);color:rgba(255,255,255,.6)}
#bar .sep{flex:none;width:1px;height:18px;background:rgba(255,255,255,.18)}
#bar .up{flex:1;min-width:0;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
#bar .up .track{display:inline-flex;gap:22px;align-items:baseline}
#bar .up.scroll .track{animation:ticker var(--dur,20s) linear infinite}
@keyframes ticker{0%,8%{transform:translateX(0)}92%,100%{transform:translateX(var(--shift))}}
#bar .up i{font-style:normal;font-weight:800;color:var(--accent);margin-right:6px;font-variant-numeric:tabular-nums}
#bar .up small{font:500 12px var(--font);color:rgba(255,255,255,.55);margin-left:6px}
#bar .up .k{font:700 12px var(--font);letter-spacing:.1em;color:rgba(255,255,255,.5);margin-right:2px}
#bar .help{flex:none;padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.08);font:600 12.5px var(--font);color:rgba(255,255,255,.7)}
#bar .help code{font:700 12.5px var(--font);color:var(--accent)}
</style>
</head>
<body>
<div id="bar" class="away"><span class="now"><span class="k">正在唱</span><span class="t"></span><span class="u"></span></span><span class="sep"></span>
  <span class="up"><span class="track"></span></span><span class="help"></span></div>
<div id="card" class="away">
  <div class="lbl"><span class="dot"></span>正在唱</div>
  <div id="now"><div class="t"></div><div class="u"></div></div>
  <div class="empty" id="empty" hidden>等待下一首…</div>
  <div id="next" hidden><div class="lbl" style="color:rgba(255,255,255,.5)">接下來</div><ol></ol></div>
  <div id="foot"><span id="count">今天唱了 <b>0</b> 首</span><span id="hint" hidden></span></div>
</div>
<script>
const $ = s => document.querySelector(s);
const P = new URLSearchParams(location.search);
const BOARD = P.get('style') === 'board';
const N = Math.max(0, Math.min(10, +(P.get('n') ?? (BOARD ? 8 : 3))));
if (P.get('side') === 'right') document.body.classList.add('right');
const BAR = P.get('style') === 'bar';
if (BAR) document.body.classList.add('style-bar');
if (BOARD) document.body.classList.add('style-board');
if (P.get('pos') === 'top') document.body.classList.add('top');
const fitBar = () => document.body.classList.toggle('fill', innerHeight <= 160);
addEventListener('resize', fitBar); fitBar();
if (P.get('bg') === '0') document.body.classList.add('nobg');
document.documentElement.style.setProperty('--s', Math.max(.5, Math.min(3, +(P.get('scale') || 1))));
if (P.get('count') === '0') $('#count').hidden = true;
let lastNow = null, lastCount = null, cmds = '!點歌', Q = null, trk = null, lastPlay = 0;
// 跟著「今天開什麼台」：
//   唱歌台：唱歌時淡出 (不搶歌詞)，休息 / 聊天時才浮出點唱清單
//   聊天台、畫畫台：一直顯示「正在播放」，有開點播就加上清單
//   遊戲台、不在直播：不出現
function visible(q){
  if (!q || !q.mode || q.mode === 'off' || q.mode === 'game') return false;
  if (BOARD) return !!q.kind && !!(q.open || q.items.length);  // 大看板：自己選的，唱歌時也一直在
  if (q.mode === 'sing'){
    if (trk && trk.playing) return false;
    if (performance.now() - lastPlay < 5000) return false;
    return !!(q.items.length || q.open || q.count);
  }
  return !!trk || q.items.length > 0;
}
function render(q){
  if (!q) return;
  Q = q;
  const now = q.items.find(i => i.status === 'now'), queued = q.items.filter(i => i.status === 'queued');
  $('#card').classList.toggle('away', !visible(q));
  const sing = q.mode === 'sing';
  $('#card .lbl').lastChild.textContent = sing ? '正在唱' : '正在播放';
  $('#count').hidden = !sing || P.get('count') === '0';
  // 聊天 / 畫畫台：沒有點播在唱時，顯示播放器正在播的歌
  const show = now ? {title: now.query, sub: now.user ? `${now.user} 點播` : '實況主選歌', key: 'q' + now.id}
             : (!sing && trk) ? {title: trk.title, sub: trk.artist || '', key: 't' + trk.track_id} : null;
  const key = show ? show.key : null;
  $('#now').hidden = !show; $('#empty').hidden = !!show;
  $('#empty').textContent = queued.length ? '準備下一首…' : (q.open ? '還沒有人點歌，快來點！' : '休息一下，等等繼續');
  if (show){
    $('#now .t').textContent = show.title;
    $('#now .u').textContent = show.sub;
    if (key !== lastNow){ const n = $('#now'); n.classList.remove('enter'); void n.offsetWidth; n.classList.add('enter'); }
  }
  lastNow = key;
  const ol = $('#next ol'); ol.innerHTML = '';
  queued.slice(0, N).forEach((it, k) => {
    const li = document.createElement('li');
    li.innerHTML = '<i></i><span></span><small></small>';
    li.querySelector('i').textContent = k + 1;
    li.querySelector('span').textContent = it.query;
    li.querySelector('small').textContent = it.user ? it.user : '';
    ol.appendChild(li);
  });
  $('#next').hidden = !N || !queued.length;
  const b = $('#count b');
  if (lastCount !== null && q.count > lastCount){ b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  b.textContent = q.count; lastCount = q.count;
  const h = $('#hint');
  h.hidden = !q.open || P.get('hint') === '0';
  h.innerHTML = '聊天室打 <code></code> 點歌 · <code>!排隊</code> 查順序'; h.querySelector('code').textContent = cmds + ' 歌名';
  if (BAR) renderBar(q, now, queued);
  $('#foot').hidden = $('#count').hidden && h.hidden;
}

// 細長條：唱歌時也在 (觀眾想知道自己的歌到了沒)；遊戲台、不在直播、沒開點歌又沒歌排隊時才收起來
let barKey = '';
function renderBar(q, now, queued){
  const bar = $('#bar'), sing = q.mode === 'sing';
  bar.classList.toggle('away', !q.kind || !(q.open || q.items.length));
  const show = now ? {t: now.query, u: now.user ? `${now.user} 點的` : ''} : (!sing && trk) ? {t: trk.title, u: trk.artist || ''} : {t: '準備中', u: ''};
  bar.querySelector('.now .k').textContent = sing ? '正在唱' : '正在播';
  bar.querySelector('.now .t').textContent = show.t;
  bar.querySelector('.now .u').textContent = show.u;
  const key = JSON.stringify(queued.map(i => [i.id, i.query, i.user]));
  if (key !== barKey){
    barKey = key;
    const tr = bar.querySelector('.up .track'); tr.innerHTML = '';
    const head = document.createElement('span'); head.className = 'k'; head.textContent = queued.length ? '接下來' : (q.open ? '還沒有人點歌' : ''); tr.appendChild(head);
    queued.forEach((it, k) => {
      const el = document.createElement('span');
      el.innerHTML = '<i></i><span></span><small></small>';
      el.querySelector('i').textContent = k + 1;
      el.querySelector('span').textContent = it.query;
      el.querySelector('small').textContent = it.user || '';
      tr.appendChild(el);
    });
    // 太長就慢慢往左捲 (到底停一下再回來)
    requestAnimationFrame(() => {
      const up = bar.querySelector('.up'), over = tr.scrollWidth - up.clientWidth;
      up.classList.toggle('scroll', over > 8);
      tr.style.setProperty('--shift', -(over + 24) + 'px');
      tr.style.setProperty('--dur', Math.max(10, over / 30) + 's');
    });
  }
  const help = bar.querySelector('.help');
  help.hidden = !q.open || P.get('hint') === '0';
  help.innerHTML = '<code></code> 點歌 · <code>!排隊</code> 查順序'; help.querySelector('code').textContent = cmds + ' 歌名';
}

let ws;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onclose = () => setTimeout(connect, 1000);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state'){
      if (m.config && m.config.queue) cmds = (m.config.queue.cmds || '!點歌').split(/\s+/)[0] || '!點歌';
      const a = m.track && m.track.accent; if (Array.isArray(a)) document.documentElement.style.setProperty('--accent', `rgb(${a.join(',')})`);
      trk = m.track || null;
      if (trk && trk.playing) lastPlay = performance.now();
      render(m.queue || Q);
    } else if (m.type === 'queue') render(m);
  };
}
connect();
setInterval(() => render(Q), 1000);
</script>
</body>
</html>
