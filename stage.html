<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hummi 舞台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@600;900&family=Inter:wght@500;800;900&display=swap" rel="stylesheet">
<style>
/* ───────── Hummi 舞台：唱歌台 / OBS 用的歌詞演出 ─────────
   ?obs=1 → OBS 瀏覽器來源 (沒有設定面板、滑鼠游標)，其他參數：mode、bg、size、tr、card、next、font */
:root{
  --accent:#ffffff; --accent2:#b9a6ff; --c1:#3a2a6a; --c2:#a04a7a; --c3:#1f4a7a; --c4:#2a6a5a;
  --size:1; --beat:0; --energy:0;
  --font:"Noto Sans TC","Inter",system-ui,sans-serif;
  --dim:rgba(255,255,255,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{width:100%;height:100%;overflow:hidden;background:#05050a;color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased}
body.transparent,body.transparent html{background:transparent}
body.obs{cursor:none}
#bg,#bg canvas,#cover-bg{position:fixed;inset:0;width:100%;height:100%}
#cover-bg{inset:-12%;width:124%;height:124%;background-size:cover;background-position:center;filter:blur(70px) saturate(1.5) brightness(.55);
  opacity:0;transition:opacity 1.2s, background-image 1s;transform:scale(calc(1 + var(--beat) * .03))}
body.bg-cover #cover-bg,body.bg-fluid #cover-bg,body.bg-particles #cover-bg{opacity:1}
body.bg-fluid #cover-bg{opacity:.45}
body.bg-particles #cover-bg{opacity:.35}
body.transparent #cover-bg{display:none}
body.scene #cover-bg{opacity:0!important}
body.scene.transparent{background:#05050a}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 40%,rgba(0,0,0,.55) 100%)}
body.transparent #vignette{display:none}

#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;overflow:hidden}
.ln{position:absolute;left:5vw;right:5vw;top:50%;translate:0 -50%;text-align:center;font-weight:900;font-size:calc(7.6vmin * var(--size) * var(--k,1));line-height:1.22;
  letter-spacing:.01em;will-change:transform,opacity,filter}
.ln.next{--k:var(--next,1)}  /* 下一句的大小 (設定 → 外觀 → 下一句大小) */
.ln .tr{display:block;font-weight:700;font-size:.42em;margin-top:.45em;opacity:.75;letter-spacing:.02em}
.ln .w{position:relative}
.ln .w .rt{position:absolute;left:0;bottom:100%;width:calc(var(--n,1) * 2.6em);margin-bottom:-.1em;text-align:center;font-size:.36em;font-weight:700;line-height:1;
  font-style:normal;white-space:nowrap;letter-spacing:0;color:#fff;-webkit-text-fill-color:#fff;opacity:.85;pointer-events:none}
.w{display:inline-block;white-space:pre;will-change:transform}
/* 共用：逐字填色 (--p = 這個字唱到幾成) */
.fill .w{background:linear-gradient(90deg,var(--accent) calc(var(--p,0)*100%),var(--dim) calc(var(--p,0)*100% + .01%));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.shadow .w{filter:drop-shadow(0 .06em .18em rgba(0,0,0,.55))}

/* 1. 浮空：一句一句從下方浮上來，帶景深模糊，唱的時候輕輕漂浮 */
.m-float .ln{transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity 1s,filter 1s}
.m-float .ln.enter{transform:translateY(1.3em) scale(.92);opacity:0;filter:blur(14px)}
.m-float .ln.cur{transform:translateY(0) scale(1);opacity:1;filter:blur(0);animation:bob 5s ease-in-out infinite}
.m-float .ln.prev{transform:translateY(-1.6em) scale(.86);opacity:0;filter:blur(10px)}
.m-float .ln.next{transform:translateY(1.9em) scale(.7);opacity:.28;filter:blur(2px)}
.m-float .ln.cur .w.on{text-shadow:0 0 .4em color-mix(in srgb,var(--accent) 55%,transparent)}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-.12em}}

/* 2. 飛入：每個字從四面八方飛進來，下一句來時往外散開 */
.m-fly .ln{transition:opacity .6s}
.m-fly .ln .w{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(2.2);filter:blur(8px);
  transition:transform .75s cubic-bezier(.18,1.35,.4,1),opacity .45s,filter .6s}
.m-fly .ln .w.in{opacity:1;transform:none;filter:none}
.m-fly .ln .w.on{color:var(--accent);text-shadow:0 0 .35em color-mix(in srgb,var(--accent) 60%,transparent)}
.m-fly .ln.prev .w{opacity:0;transform:translate(calc(var(--fx) * -1.2),calc(var(--fy) * -1.2)) rotate(calc(var(--fr) * -1)) scale(.4);filter:blur(6px);
  transition:transform .9s cubic-bezier(.5,0,.8,.4),opacity .8s,filter .8s}
.m-fly .ln.next{opacity:0}
.m-fly .ln .tr{transition:opacity .6s}
.m-fly .ln.prev .tr,.m-fly .ln.enter .tr{opacity:0}

/* 3. 逐字彈跳：唱到的字跳起來 */
.m-bounce .ln{transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s}
.m-bounce .ln.enter{transform:translateY(.8em);opacity:0}
.m-bounce .ln.cur{transform:none;opacity:1}
.m-bounce .ln.prev{transform:translateY(-1.1em) scale(.8);opacity:0}
.m-bounce .ln.next{transform:translateY(1.5em) scale(.72);opacity:.3}
.m-bounce .w{color:var(--dim);transition:color .2s}
.m-bounce .w.on{color:var(--accent)}
.m-bounce .w.hit{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-.42em) scale(1.18,1.12)}70%{transform:translateY(.04em) scale(.96,1.04)}100%{transform:none}}

/* 4. 霓虹：發光燈管字，進場閃爍，唱過的字點亮 */
.m-neon .ln{font-family:"Inter","Noto Sans TC",sans-serif;letter-spacing:.04em;transition:opacity .5s}
.m-neon .ln.cur{animation:flicker 1.1s linear 1}
.m-neon .ln.prev,.m-neon .ln.enter{opacity:0}
.m-neon .ln.next{opacity:.22;transform:translateY(1.9em) scale(.7)}
.m-neon .w{color:transparent;-webkit-text-stroke:.025em color-mix(in srgb,var(--accent) 70%,#fff);
  text-shadow:0 0 .12em color-mix(in srgb,var(--accent) 35%,transparent);transition:color .25s,text-shadow .25s}
.m-neon .w.on{color:#fff;-webkit-text-stroke:0;
  text-shadow:0 0 .05em #fff,0 0 .18em var(--accent),0 0 .45em var(--accent),0 0 .9em var(--accent),0 0 1.6em color-mix(in srgb,var(--accent) 60%,transparent)}
.m-neon .ln.cur{filter:brightness(calc(1 + var(--beat) * .35))}
@keyframes flicker{0%,8%,14%,22%{opacity:.15}4%,11%,18%,26%,100%{opacity:1}}

/* 5. 景深：歌詞排成立體的捲軸，正在唱的那句在焦點上 */
.m-depth #stage{perspective:900px}
.m-depth .ln{transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s,filter .9s;
  transform:translateY(calc(var(--o) * 1.75em)) translateZ(calc(var(--a) * -180px)) rotateX(calc(var(--o) * -16deg)) scale(calc(1 - var(--a) * .1));
  opacity:calc(1 - var(--a) * .3);filter:blur(calc(var(--a) * 2.4px))}
.m-depth .ln.cur{text-shadow:0 0 .5em color-mix(in srgb,var(--accent) 40%,transparent)}
.m-depth .ln .tr{position:absolute;left:0;right:0;top:100%;margin-top:.15em;opacity:0;transition:opacity .6s}
.m-depth .ln.cur .tr{opacity:.75}

/* 6. KTV：兩行交錯，粗描邊，逐字掃色 */
.m-ktv .ln{font-size:calc(8vmin * var(--size) * var(--k,1));text-align:left;left:7vw;right:7vw;transition:opacity .4s}
.m-ktv .ln.slot0{top:36%}
.m-ktv .ln.slot1{top:64%;text-align:right}
.m-ktv .ln.prev,.m-ktv .ln.enter{opacity:0}
.m-ktv .ln .w{position:relative;color:#fff;
  text-shadow:0 0 .06em #0a0a1e,.05em .05em 0 #0a0a1e,-.05em .05em 0 #0a0a1e,.05em -.05em 0 #0a0a1e,-.05em -.05em 0 #0a0a1e,
              .06em 0 0 #0a0a1e,-.06em 0 0 #0a0a1e,0 .06em 0 #0a0a1e,0 -.06em 0 #0a0a1e,0 .12em .2em rgba(0,0,0,.6)}
.m-ktv .ln .w::after{content:attr(data-t);position:absolute;left:0;top:0;width:calc(var(--p,0) * 100%);overflow:hidden;white-space:pre;
  color:var(--accent);text-shadow:inherit}
.m-ktv .ln .tr{display:none}


/* 7. 霧窗：起霧的玻璃，唱到的字被手指抹開，透出後面清楚的光 (畫在 canvas 上) */
.m-fog #stage,.m-fog #gap{display:none}

/* 8. 雨夜：雨中的城市燈光，字像倒映在濕地上 */
.m-rain .ln{transition:transform 1.2s cubic-bezier(.2,.8,.2,1),opacity 1s,filter 1s;
  -webkit-box-reflect:below .02em linear-gradient(transparent 40%,rgba(255,255,255,.22))}
.m-rain .ln.enter{transform:translateY(-.7em);opacity:0;filter:blur(12px)}
.m-rain .ln.cur{opacity:1}
.m-rain .ln.prev{transform:translateY(.8em);opacity:0;filter:blur(14px)}
.m-rain .ln.next{opacity:0}
.m-rain .w{color:rgba(255,255,255,.28);transition:color .4s,text-shadow .4s}
.m-rain .w.on{color:#fff;text-shadow:0 0 .25em var(--accent),0 0 .8em color-mix(in srgb,var(--accent) 50%,transparent)}

/* 9. 散字：一句話的字散成大大小小、歪歪斜斜的字雲，唱到才蹦出來 */
.m-scatter .ln{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.05em .28em;transition:opacity .9s,filter .9s,transform .9s}
.m-scatter .ln .w{font-size:calc(var(--ws) * 1em);opacity:0;transform:rotate(var(--wr)) translateY(var(--wy)) scale(0);
  transition:transform .7s cubic-bezier(.2,1.6,.4,1),opacity .35s,color .3s}
.m-scatter .ln .w.in{opacity:1;transform:rotate(var(--wr)) translateY(var(--wy)) scale(1)}
.m-scatter .ln .w.on{color:var(--accent);text-shadow:0 0 .35em color-mix(in srgb,var(--accent) 45%,transparent)}
.m-scatter .ln.prev{opacity:0;filter:blur(14px);transform:scale(1.25)}
.m-scatter .ln.next{opacity:0}
.m-scatter .ln .tr{flex-basis:100%;text-align:center}

/* 10. 階梯：字一個一個往右下走下樓梯，鏡頭跟著唱到的字移動 */
.m-stairs .ln{left:50%;right:auto;top:45%;translate:none;width:0;white-space:nowrap;text-align:left;
  transition:transform 1s cubic-bezier(.2,.8,.2,1),opacity .8s}
.m-stairs .ln .w{position:absolute;opacity:0;transform:translateY(-1.3em) rotate(-8deg);color:rgba(255,255,255,.4);
  transition:transform .65s cubic-bezier(.2,1.5,.4,1),opacity .4s,color .3s}
.m-stairs .ln .w.in{opacity:1;transform:none}
.m-stairs .ln .w.on{color:var(--accent);text-shadow:0 0 .3em color-mix(in srgb,var(--accent) 50%,transparent)}
.m-stairs .ln.prev{opacity:0}
.m-stairs .ln.next,.m-stairs .ln .tr{display:none}

/* 11. 迴環：字繞成一個圓圈慢慢轉，下一句在內圈 */
.m-ring .ln{left:50%;right:auto;top:50%;translate:none;width:0;height:0;font-size:calc(4.6vmin * var(--size) * var(--k,1));
  transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity 1s,filter 1s}
.m-ring .ln .spin{position:absolute;left:0;top:0;animation:spin 50s linear infinite}
.m-ring .ln .w{position:absolute;left:0;top:0;transform-origin:0 0;white-space:pre;
  transform:rotate(var(--ang)) translate(-50%, calc(var(--R) * -1));color:rgba(255,255,255,.3);transition:color .3s,text-shadow .3s}
.m-ring .ln .w.on{color:var(--accent);text-shadow:0 0 .35em color-mix(in srgb,var(--accent) 55%,transparent)}
.m-ring .ln.enter{transform:scale(.3) rotate(-60deg);opacity:0}
.m-ring .ln.cur{transform:none;opacity:1}
.m-ring .ln.next{transform:scale(.58) rotate(20deg);opacity:.32;filter:blur(1px)}
.m-ring .ln.prev{transform:scale(1.7) rotate(40deg);opacity:0;filter:blur(8px)}
.m-ring .ln .tr{position:absolute;left:0;top:0;translate:-50% -50%;width:44vmin;text-align:center;font-size:.62em}
.m-ring .ln.next .tr{display:none}
@keyframes spin{to{rotate:360deg}}

/* 12. 霓虹街：像素風的夜晚城市 + 霓虹燈字 (字的樣式跟霓虹一樣) */
.m-city .ln{top:30%}
/* 13. 煙火：節拍一來就放煙火 */

/* ───── 內嵌 Folia 的歌詞效果 (iframe)：用 Folia 的時候，Hummi 自己的畫面全部收起來 ───── */
#folia-frame,#folia-shield{position:fixed;inset:0;width:100%;height:100%;border:0;display:none}
#folia-shield{background:transparent;z-index:3}
body.folia #folia-frame,body.folia #folia-shield{display:block}
body.folia #stage,body.folia #bg,body.folia #cover-bg,body.folia #vignette,body.folia #intro,body.folia #gap{display:none!important}
body.folia.no-folia-card #card{display:none}
.grid.folia button.on{background:#8b6cff;border-color:#8b6cff;color:#fff}
.src-note{font:500 11px "Noto Sans TC";color:rgba(255,255,255,.45);margin:6px 2px 0;line-height:1.5}

/* ───── 舞台設定：分頁 ───── */
#panel h2 button{background:none;border:0;color:rgba(255,255,255,.5);font-size:20px;cursor:pointer}
#p-tabs,.seg2{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.07);margin-bottom:12px}
#p-tabs button,.seg2 button{flex:1;height:32px;border:0;border-radius:9px;background:none;color:rgba(255,255,255,.6);font:700 12px "Noto Sans TC";cursor:pointer}
#p-tabs button.on,.seg2 button.on{background:rgba(255,255,255,.16);color:#fff}
.seg2{background:rgba(255,255,255,.04)}
.ppane{display:none}.ppane.on{display:block}
#panel .grid{grid-template-columns:repeat(3,1fr)}
#panel .grid button{height:44px}
#panel select{background:#222;color:#fff;border:1px solid #444;border-radius:8px;padding:4px 6px}
#panel input[type=color]{width:34px;height:22px;border:0;background:none}
/* 前奏 / 間奏 */
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;pointer-events:none;
  opacity:0;transition:opacity .8s,transform .8s;transform:scale(.96)}
#intro.show{opacity:1;transform:none}
#intro img{width:calc(26vmin * var(--size));height:calc(26vmin * var(--size));border-radius:6%;object-fit:cover;
  box-shadow:0 2vmin 8vmin rgba(0,0,0,.5);transform:scale(calc(1 + var(--beat) * .04));transition:transform .1s}
#intro .t{font-weight:900;font-size:calc(5vmin * var(--size));margin-top:.5em;text-align:center;padding:0 6vw}
#intro .a{font-weight:700;font-size:calc(2.6vmin * var(--size));opacity:.65}
#gap{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:calc(7vmin * var(--size));letter-spacing:.6em;
  opacity:0;transition:opacity .6s;pointer-events:none}
#gap.show{opacity:.7}
#gap span{display:inline-block;animation:dot 1.4s ease-in-out infinite}
#gap span:nth-child(2){animation-delay:.2s}#gap span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-.3em);opacity:1}}

/* 歌曲卡片 (左下) */
#card{position:fixed;left:3vmin;bottom:3vmin;display:flex;align-items:center;gap:1.6vmin;padding:1.2vmin 2.2vmin 1.2vmin 1.2vmin;border-radius:2.2vmin;
  background:rgba(10,10,20,.45);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);transform:translateY(160%);transition:transform .7s cubic-bezier(.2,.9,.2,1)}
#card.show{transform:none}
#ask{position:fixed;right:3vmin;top:3vmin;z-index:6;max-width:46vw;padding:1.4vmin 2.2vmin;border-radius:2vmin;background:rgba(14,14,22,.78);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(16px);color:#fff;font-family:var(--font);transform:translateY(-140%);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.3,1.2),opacity .4s}
#ask.show{transform:none;opacity:1}
#ask .q{font-size:1.6vmin;color:rgba(255,255,255,.65)}
#ask .s{font-size:2.6vmin;font-weight:800;margin-top:.4vmin;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ask .s::before{content:'🎵 '}
#ask .a{font-size:1.8vmin;color:var(--accent,#cdbfff);margin-top:.2vmin}
#card img{width:7vmin;height:7vmin;border-radius:1.2vmin;object-fit:cover}
#card .t{font-weight:800;font-size:2.2vmin;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .a{font-weight:500;font-size:1.6vmin;opacity:.65;margin-top:.3vmin}
#card .bar{height:.45vmin;border-radius:1vmin;background:rgba(255,255,255,.15);margin-top:.9vmin;overflow:hidden;width:24vmin}
#card .bar i{display:block;height:100%;width:0;background:var(--accent)}
body.no-card #card{display:none}

/* 設定面板 */
#gear{position:fixed;right:20px;top:20px;width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(20,20,30,.6);
  backdrop-filter:blur(16px);color:#fff;font-size:20px;cursor:pointer;opacity:0;transition:opacity .3s;z-index:20}
body.ui #gear,body.ui #home,body.ui #find{opacity:1}
/* 在主視窗裡打開時：上面一條標題列 (拖曳、縮小、放大、關閉)，滑鼠一動才出現 */
#tb{display:none;position:fixed;left:0;right:0;top:0;height:36px;z-index:30;align-items:center;background:linear-gradient(rgba(0,0,0,.45),transparent);
  opacity:0;transition:opacity .3s;user-select:none}
body.inwin #tb{display:flex}
body.inwin.ui #tb{opacity:1}
#tb .drag{flex:1;height:100%;display:flex;align-items:center;gap:8px;padding-left:14px;font:600 12px "Noto Sans TC",sans-serif;color:rgba(255,255,255,.7);
  app-region:drag;-webkit-app-region:drag}
#tb button{app-region:no-drag;-webkit-app-region:no-drag;width:44px;height:100%;border:0;background:none;color:rgba(255,255,255,.75);cursor:pointer;
  display:grid;place-items:center}
#tb button:hover{background:rgba(255,255,255,.12);color:#fff}
#tb #tb-x:hover{background:#e81123}
#tb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.4}
body.inwin #gear,body.inwin #home,body.inwin #find{top:48px}
body.inwin #panel{top:104px}
body.inwin #nolyr{top:48px}
#find{position:fixed;right:124px;top:20px;width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(20,20,30,.6);
  backdrop-filter:blur(16px);color:#fff;font:18px "Segoe Fluent Icons","Segoe MDL2 Assets";cursor:pointer;opacity:0;transition:opacity .3s;z-index:20}
/* 沒有歌詞時：滑鼠一動就出現「找歌詞」 */
#nolyr{position:fixed;left:50%;top:22px;transform:translate(-50%,-8px);z-index:20;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;
  border-radius:999px;background:rgba(16,16,26,.72);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);color:rgba(255,255,255,.75);
  font:600 13px "Noto Sans TC",sans-serif;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s}
body.ui.nolyr #nolyr{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#nolyr button{height:32px;padding:0 14px;border-radius:999px;border:0;background:#fff;color:#111;font:700 13px "Noto Sans TC",sans-serif;cursor:pointer}
/* 找歌詞視窗 */
#fd{position:fixed;inset:0;z-index:40;display:none;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
#fd.open{display:grid}
#fd .box{width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 64px);display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
  background:rgba(18,18,28,.92);border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 80px rgba(0,0,0,.6);color:#fff;font-family:"Noto Sans TC",sans-serif}
#fd header{display:flex;gap:4px;padding:10px 10px 0 12px;align-items:center}
#fd header .tab{height:34px;padding:0 14px;border-radius:10px;border:0;background:none;color:rgba(255,255,255,.6);font:600 13px inherit;font-family:inherit;cursor:pointer}
#fd header .tab.on{background:rgba(255,255,255,.12);color:#fff}

    <label class="row">換歌時顯示歌曲卡片 <input type="checkbox" id="o-card"></label>
    <label class="row">跟著節拍脈動 <input type="checkbox" id="o-beat"></label>
    <div class="src-note">字體大小兩種效果都有作用 (Folia 效果放開滑桿後會重新載入一下)；其他外觀設定只用在 Hummi 效果。</div>
  </div>

    <div class="src-note">在 OBS 新增「瀏覽器」來源，貼上網址，寬高設 1920×1080。Hummi 要開著，OBS 才拿得到歌詞。</div>
    <div id="msg"></div>
  </div>
</aside>
<script>
const $ = s => document.querySelector(s);
const MODES = [['float','浮空','一句句浮上來'],['fly','飛入','字從四面飛來'],['bounce','彈跳','唱到的字跳起'],
               ['neon','霓虹','發光燈管字'],['depth','景深','立體歌詞捲軸'],['ktv','KTV','兩行逐字掃色'],
               ['fog','霧窗','抹開起霧的玻璃'],['rain','雨夜','雨中城市倒影'],['scatter','散字','大小不一的字雲'],
               ['stairs','階梯','字走下樓梯'],['ring','圓環','繞成圓圈旋轉'],['city','霓虹街','像素夜城'],
               ['fireworks','煙火','節拍放煙火']];
// 這些效果自帶背景 (不管背景選什麼)
const SCENE_MODES = {fog: 1, rain: 1, city: 1, fireworks: 1};
// Folia 的歌詞效果 (內嵌，AGPL-3.0，github.com/chthollyphile/folia-major)
const FOLIA_MODES = [['classic','流光'],['cadenza','心象'],['partita','雲階'],['fume','浮名'],['monet','莫奈'],['cappella','群唱'],
  ['tilt','傾訴'],['claddagh','迴環'],['diorama','鏡台'],['pendolo','時計'],['sonnet','商籟'],['tempera','凝彩'],
  ['lumiere','繪光'],['nebbia','霧箋'],['hanabi','花火'],['machi','町景'],['still','靜止']];
const isFolia = m => m.startsWith('folia:');
const foliaUrl = (mode, obs) => `http://${obs ? '127.0.0.1:' + location.port : location.host}/folia/?` + new URLSearchParams({
  obs: 1, obsSource: 'playercap', host: obs ? '127.0.0.1:' + location.port : location.host, nxpcPlayer: 'hummi',
  visualizer: mode.slice(6), cfg: JSON.stringify({lyricsFontScale: opt.size}), ...(opt.transparent ? {transparent: 1} : {})});
const NOFILL = ['ktv', 'neon', 'bounce', 'rain', 'city', 'scatter', 'stairs', 'ring'];
const REVEAL = ['fly', 'scatter', 'stairs'];  // 字要唱到 (前一點點) 才出現的效果
const BGS = [['fluid','流動','專輯色流動'],['particles','粒子','光點飄浮'],['stars','星空','星光穿梭'],
             ['cover','封面','模糊封面'],['aurora','極光','光帶起伏']];
const FONTS = {sans:'"Noto Sans TC","Inter",system-ui,sans-serif', serif:'"Noto Serif TC","Noto Sans TC",serif', latin:'"Inter","Noto Sans TC",sans-serif'};
const params = new URLSearchParams(location.search);
const OBS = params.has('obs');
let opt = {mode:'folia:classic', bg:'fluid', transparent:false, size:1, nsize:1, next:true, card:true, beat:true, album:true, color:'#ffffff', font:'sans'};
try { Object.assign(opt, JSON.parse(localStorage.getItem('hummi.stage') || '{}')); } catch {}
for (const k of Object.keys(opt)){
  if (!params.has(k)) continue;
  const v = params.get(k);
  opt[k] = typeof opt[k] === 'boolean' ? v === '1' : typeof opt[k] === 'number' ? +v : v;
}
if (opt.bg === 'none'){ opt.bg = 'fluid'; opt.transparent = true; }  // 舊設定：背景選「透明」改成獨立的開關
const LIVE_SRC = !OBS && !params.has('wallpaper');  // 這個舞台的設定會同步給 OBS
const pushLive = () => { if (LIVE_SRC) sendWs({type: 'stage_opt', opt}); };
const save = () => { if (!OBS) try { localStorage.setItem('hummi.stage', JSON.stringify(opt)); } catch {} pushLive(); };
if (OBS) document.body.classList.add('obs');
// 桌布模式：跟舞台用同一套設定，舞台那邊改了就跟著換
if (params.has('wallpaper')){ opt.transparent = false; addEventListener('storage', e => { if (e.key === 'hummi.stage') location.reload(); }); }

// ───── 資料 ─────
let track = null, lyr = null, lines = [], cfgOffset = 0;
let anchorPos = 0, anchorAt = performance.now(), playing = false;
let energy = 0, beat = 0, levels = [0,0,0,0], lastEnergy = 0, beatAvg = 0;
const now = () => anchorPos + (playing ? (performance.now() - anchorAt) / 1000 : 0);
let ws;
function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { ws.send(JSON.stringify({type:'hello', stage:true})); pushLive(); };
  ws.onclose = () => setTimeout(connect, 1000);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') onState(m);
    else if (m.type === 'lyrics') onLyrics(m);
    else if (m.type === 'viz') onViz(m);
    else if (m.type === 'chat_song') showAsk(m);
    else if (m.type === 'stage_opt') applyLive(m.opt);
  };
}
let askTimer = 0;
function showAsk(m){  // 直播聊天室有人打 !song：右上角跳出現在播放
  let el = document.getElementById('ask');
  if (!el){ el = document.createElement('div'); el.id = 'ask'; el.innerHTML = '<div class="q"></div><div class="s"></div><div class="a"></div>'; document.body.appendChild(el); }
  el.querySelector('.q').textContent = `${m.user} 問：這是什麼歌？`;
  el.querySelector('.s').textContent = m.title; el.querySelector('.a').textContent = m.artist || '';
  el.classList.add('show'); clearTimeout(askTimer); askTimer = setTimeout(() => el.classList.remove('show'), 8000);
}
function onState(m){
  if (m.config) cfgOffset = +m.config.offset || 0;
  const t = m.track;
  if (!t){ if (track){ track = null; lines = []; rebuild(); } playing = false; return; }
  const changed = !track || track.track_id !== t.track_id;
  const pos = t.position + (t.playing ? Math.max(0, Date.now() / 1000 - t.ts) : 0);
  if (changed || t.playing !== playing || Math.abs(now() - pos) > .35){ anchorPos = pos; anchorAt = performance.now(); }
  playing = t.playing;
  track = t;
  if (changed){
    lyr = null; lines = []; onTrack(t);
    // 歌詞有時候比「正在播什麼」先到：先收著，現在套用
    if (pendingLyr && pendingLyr.track_id === t.track_id){ lyr = pendingLyr; lines = lyr.synced ? normalize(lyr.lines || []) : []; }
    pendingLyr = null;
    rebuild();
  }
  if (t.has_art && (!artLoaded || artV !== (t.art_v || 0))) { artV = t.art_v || 0; loadArt(t); }
}
let pendingLyr = null;
// ───── 音樂控制列 ─────
// OBS 的舞台畫面：跟著舞台目前的設定即時換 (網址加 fixed=1 就固定用網址裡的設定)
let liveKey = '';
function applyLive(o){
  if (!OBS || params.has('fixed') || !o) return;
  const k = JSON.stringify(o);
  if (k === liveKey) return;
  liveKey = k;
  Object.assign(opt, o);
  applyOpts(); applyBg();
  rebuild();  // 裡面會換 Folia 效果 (網址不同才重新載入)
}
const sendWs = m => { try { ws.readyState === 1 && ws.send(JSON.stringify(m)); } catch {} };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
$('#c-play').onclick = e => { e.stopPropagation(); sendWs({type: 'toggle'}); };
$('#c-prev').onclick = e => { e.stopPropagation(); sendWs({type: 'prev'}); };
$('#c-next').onclick = e => { e.stopPropagation(); sendWs({type: 'next'}); };
$('#c-vup').onclick = e => { e.stopPropagation(); sendWs({type: 'volume', delta: .05}); };
$('#c-vdown').onclick = e => { e.stopPropagation(); sendWs({type: 'volume', delta: -.05}); };
$('#ctl').addEventListener('click', e => e.stopPropagation());
$('#c-track').onclick = e => {
  e.stopPropagation();
  const dur = track && track.duration; if (!dur) return;
  const r = e.currentTarget.getBoundingClientRect(), t = (e.clientX - r.left) / r.width * dur;
  sendWs({type: 'seek', t}); anchorPos = t; anchorAt = performance.now();
};
function ctlTick(){
  if (!OBS){
    const dur = (track && track.duration) || 0, cur = Math.min(now(), dur || now());
    $('#c-play').innerHTML = playing ? '&#xF8AE;' : '&#xF5B0;';
    $('#c-cur').textContent = fmt(cur); $('#c-dur').textContent = fmt(dur);
    $('#c-track i').style.width = dur ? (cur / dur * 100).toFixed(2) + '%' : '0';
  }
  setTimeout(ctlTick, 250);
}
ctlTick();
addEventListener('keydown', e => {
  if (OBS || e.target.closest?.('input,select,textarea')) return;
  if (e.key === ' '){ e.preventDefault(); sendWs({type: 'toggle'}); }
  else if (e.ctrlKey && e.key === 'ArrowRight'){ e.preventDefault(); sendWs({type: 'next'}); }
  else if (e.ctrlKey && e.key === 'ArrowLeft'){ e.preventDefault(); sendWs({type: 'prev'}); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); sendWs({type: 'volume', delta: .05}); }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); sendWs({type: 'volume', delta: -.05}); }
});
function onLyrics(m){
  if (m.loading) return;
  if (!track || m.track_id !== track.track_id){ pendingLyr = m; return; }
  lyr = m;
  lines = m.synced ? normalize(m.lines || []) : [];
  rebuild();
}
function onViz(m){
  levels = m.levels || levels;
  const e = m.energy || 0;
  energy += (e - energy) * .5;
  beatAvg = beatAvg * .92 + e * .08;
  if (e > beatAvg * 1.35 + .04 && e - lastEnergy > .03) beat = 1;  // 簡單的節拍偵測：比平均大很多就是一拍
  lastEnergy = e;
}

// 歌詞整理：每句有開始、結束，每個字有時間 (沒有逐字時間就平均分配)
const CJK = /[぀-ヿ㐀-鿿豈-﫿가-힯＀-￯]/;
function tokens(text){
  const out = [];
  const re = /([぀-ヿ㐀-鿿豈-﫿가-힯＀-￯])|([^\s぀-ヿ㐀-鿿豈-﫿가-힯＀-￯]+\s*)|(\s+)/g;
  let m;
  while ((m = re.exec(text))){
    if (m[3] && out.length){ out[out.length - 1] += m[3]; continue; }
    out.push(m[0]);
  }
  return out;
}
// 作詞、作曲、製作人、版權這類資訊行：舞台上不顯示
const CREDIT = /^(作词|作詞|作曲|编曲|編曲|制作|製作|监制|監製|混音|母带|母帶|和声|和聲|录音|錄音|吉他|贝斯|貝斯|鼓|键盘|鍵盤|弦乐|弦樂|出品|发行|發行|统筹|統籌|企划|企劃|策划|策劃|营销|營銷|宣传|宣傳|监修|監修|配唱|人声|人聲|版权|版權|OP|SP|ISRC|词|詞|曲|Lyricist|Lyrics|Composer|Arranger|Producer|Mixing|Mastering|Recording|Vocal|Guitar|Bass|Drums|Keyboard|Strings)[^:：]{0,24}[:：]/i;
const CREDIT2 = /(produced|written|composed|arranged|mixed|mastered)\s+by|©|℗|版權所有|版权所有|未經許可|未经许可|^\s*\S{1,12}\s*[:：]\s*\S{1,20}\s*$/i;
function isCredit(text, i){
  const s = (text || '').trim();
  return CREDIT.test(s) || CREDIT2.test(s) && (i < 10 || /by|©|℗|版權|版权|未經|未经/i.test(s));
}
function normalize(raw){
  const L = raw.filter((l, i) => l.t != null && (l.text || '').trim() && !isCredit(l.text, i));
  return L.map((l, i) => {
    const nextT = i + 1 < L.length ? L[i + 1].t : l.t + 6;
    const span = Math.max(.6, Math.min(nextT - l.t, (l.text || '').length * .36 + 1.8, 9));
    let words;
    if (l.w && l.w.length){
      words = l.w.filter(w => w[2] !== '').map(w => ({t: w[0], d: Math.max(.08, w[1] || .25), s: w[2]}));
    } else {
      const tk = tokens(l.text);
      const weight = tk.map(s => CJK.test(s) ? 1 : Math.max(1, s.trim().length * .45));
      const total = weight.reduce((a, b) => a + b, 0) || 1;
      let acc = l.t;
      words = tk.map((s, j) => { const d = span * weight[j] / total; const w = {t: acc, d, s}; acc += d; return w; });
    }
    return {t: l.t, end: Math.max(nextT, l.t + .5), text: l.text, tr: l.tr || '', rd: l.rd || '', ruby: l.ruby || null, words};

}

function extract(img){
  const c = document.createElement('canvas'); c.width = c.height = 24;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0, 24, 24);
  const d = x.getImageData(0, 0, 24, 24).data, px = [];
  for (let i = 0; i < d.length; i += 4){
    const [r, g, b] = [d[i], d[i + 1], d[i + 2]];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    px.push({r, g, b, s: mx ? (mx - mn) / mx : 0, l: (mx + mn) / 510});

    if (pick.every(q => Math.abs(q.r - p.r) + Math.abs(q.g - p.g) + Math.abs(q.b - p.b) > 90)) pick.push(p);
    if (pick.length === 4) break;

}

}

// 日文讀音：漢字上方的小字 (掛在那幾個字的第一個方塊上，寬度跨過整個詞)；整句平假名 / 羅馬拼音放在下面一行

  if (l.ruby && l.ruby.length){
    const spans = [...el.querySelectorAll('.w')];
    const txt = spans.map(s => s.textContent);
    let k = 0;
    for (const [o, n, r] of l.ruby){
      const surf = (l.text || '').slice(o, o + n);
      for (let j = k; j < spans.length; j++){
        let acc = '', m = j;
        while (m < spans.length && acc.length < surf.length){ acc += txt[m]; m++; }
        if (acc.trim() === surf){
          const rt = document.createElement('i'); rt.className = 'rt'; rt.textContent = r;
          rt.style.setProperty('--n', m - j);

      const len = s.textContent.trim().length;

      s.style.setProperty('--ws', (big ? 1.25 + Math.random() * .5 : .6 + Math.random() * .5).toFixed(2));
      s.style.setProperty('--wr', ((Math.random() - .5) * 26).toFixed(0) + 'deg');

let foliaSrc = '';

}
function findIdx(tt){
  let lo = 0, hi = lines.length - 1, idx = -1;
  while (lo <= hi){ const mid = (lo + hi) >> 1; if (lines[mid].t <= tt){ idx = mid; lo = mid + 1; } else hi = mid - 1; }

}
function wanted(idx){
  // 每種效果要同時顯示哪幾句

  if (opt.mode === 'ktv' || opt.mode === 'ring') return [idx, idx + 1].filter(i => i >= 0 && i < lines.length);
  if (opt.mode === 'fog') return [];
  if (opt.mode === 'stairs') return [idx];

function frame(){
  if (isFolia(opt.mode)){ requestAnimationFrame(frame); return; }  // Folia 自己畫，Hummi 這邊什麼都不用做

  $('#intro').classList.toggle('show', !!track && (!lines.length || idx < 0));  // 前奏 / 沒有歌詞：大封面 + 歌名

    const want = new Set(wanted(Math.max(idx, 0)));
    if (idx < 0) want.clear();

    for (const [i, el] of Object.entries(shown)){
      if (!want.has(+i)){ el.classList.add('prev'); el.classList.remove('cur', 'next'); setTimeout(() => el.remove(), 1200); delete shown[i]; }
    }
    for (const i of want) if (!shown[i]) shown[i] = lineEl(i);

      for (const [i, el] of Object.entries(shown)){
        const o = +i - idx;
        el.classList.remove('enter', 'prev', 'cur', 'next', 'slot0', 'slot1');
        el.style.setProperty('--o', o); el.style.setProperty('--a', Math.abs(o));

      const w = l.words[k], s = ws[k];

      let k = l.words.findIndex(w => w.t > tt) - 1;
      if (k < 0) k = tt >= l.words[0].t ? l.words.length - 1 : 0;
      if (k !== el._cam && ws[k] && ws[k]._cx != null){ el._cam = k; el.style.transform = `translate(${-ws[k]._cx}px, ${-ws[k]._cy}px)`; }

// ───── 背景 ─────
const cv = $('#cv'), cx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, parts = [], stars = [];
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  parts = Array.from({length: 70}, () => newPart(true));
  stars = Array.from({length: 420}, () => newStar(true));

}
const rnd = (a, b) => a + Math.random() * (b - a);
function newPart(any){ return {x: rnd(0, W), y: any ? rnd(0, H) : H + 40 * DPR, r: rnd(2, 14) * DPR, v: rnd(.2, 1.1) * DPR, c: Math.floor(rnd(0, 4)), tw: rnd(0, 6.28), sp: rnd(.5, 2)}; }
function newStar(any){ return {x: rnd(-1, 1), y: rnd(-1, 1), z: any ? rnd(.05, 1) : 1, c: Math.floor(rnd(0, 4))}; }
let tPrev = performance.now();
function drawBg(){
  const tnow = performance.now(), dt = Math.min(.05, (tnow - tPrev) / 1000); tPrev = tnow;
  const t = tnow / 1000, e = energy, b = opt.beat ? beat : 0;
  if (isFolia(opt.mode)) return;
  if (SCENE_MODES[opt.mode]){ drawScene(opt.mode, t, dt, e, b); return; }
  cx.clearRect(0, 0, W, H);
  if (opt.bg === 'fluid'){
    cx.globalCompositeOperation = 'source-over';
    cx.fillStyle = 'rgba(6,6,14,.55)'; cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 5; i++){
      const px = W * (.5 + .38 * Math.sin(t * (.07 + i * .023) + i * 1.7));
      const py = H * (.5 + .36 * Math.cos(t * (.06 + i * .019) + i * 2.3));
      const rr = Math.max(W, H) * (.42 + .08 * Math.sin(t * .2 + i) + e * .12 + b * .05);
      const g = cx.createRadialGradient(px, py, 0, px, py, rr);
      g.addColorStop(0, palette[i % 4].replace('rgb', 'rgba').replace(')', ',.75)'));
      g.addColorStop(1, 'rgba(0,0,0,0)');
      cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    }
    cx.globalCompositeOperation = 'source-over';
  } else if (opt.bg === 'particles'){
    cx.fillStyle = 'rgba(4,4,10,.45)'; cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'lighter';
    for (const p of parts){
      p.y -= p.v * (1 + e * 3 + b * 4) * 60 * dt; p.x += Math.sin(t * .6 + p.tw) * .3 * DPR;
      if (p.y < -40 * DPR) Object.assign(p, newPart(false));
      const a = .25 + .25 * Math.sin(t * p.sp + p.tw) + e * .3;
      const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * (1 + b * .6));
      g.addColorStop(0, palette[p.c].replace('rgb', 'rgba').replace(')', `,${Math.min(1, a).toFixed(2)})`));
      g.addColorStop(1, 'rgba(0,0,0,0)');

    }

  } else if (opt.bg === 'stars'){
    cx.fillStyle = '#03030a'; cx.fillRect(0, 0, W, H);

    cx.globalCompositeOperation = 'lighter';

      const z0 = s.z; s.z -= sp;
      if (s.z <= .02) Object.assign(s, newStar(false));
      const k = .5 / s.z, k0 = .5 / Math.max(z0, .02);
      const x = W / 2 + s.x * W * k, y = H / 2 + s.y * H * k;
      const x0 = W / 2 + s.x * W * k0, y0 = H / 2 + s.y * H * k0;
      if (x < 0 || x > W || y < 0 || y > H){ Object.assign(s, newStar(false)); continue; }
      const a = Math.min(1, (1 - s.z) * 1.3);

      const base = H * (.25 + band * .14);
      const grad = cx.createLinearGradient(0, base - H * .3, 0, base + H * .25);
      const c = palette[band % 4];
      grad.addColorStop(0, 'rgba(0,0,0,0)');
      grad.addColorStop(.55, c.replace('rgb', 'rgba').replace(')', `,${(.28 + e * .3 + b * .2).toFixed(2)})`));
      grad.addColorStop(1, 'rgba(0,0,0,0)');

      }
      cx.lineTo(W, H); cx.closePath(); cx.fill();
    }
    cx.globalCompositeOperation = 'source-over';
  }
}

const rgba = (css, a) => css.replace('rgb', 'rgba').replace(')', `,${Math.max(0, Math.min(1, a)).toFixed(3)})`);
function drawScene(mode, t, dt, e, b){

  if (mode === 'rain') return drawRain(t, dt, e, b);
  if (mode === 'city') return drawCity(t, dt, e, b);
  if (mode === 'fireworks') return drawFireworks(t, dt, e, b);
}

// 散景燈光 (霧窗、雨夜共用)
function drawBokeh(x, w, h, t, e, b, sharp){
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#05060d'); g.addColorStop(1, rgba(palette[1], .35));
  x.fillStyle = '#04050a'; x.fillRect(0, 0, w, h);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'lighter';
  for (const p of bokeh){
    const px = (p.x + Math.sin(t * .03 * p.sp + p.ph) * .02) * w, py = p.y * h;
    const r = p.r * Math.max(w, h) * (1 + b * .15 + e * .1);
    const a = (.35 + .25 * Math.sin(t * p.sp + p.ph) + e * .2) * (sharp ? 1 : .9);
    const gr = x.createRadialGradient(px, py, 0, px, py, r);
    gr.addColorStop(0, rgba(palette[p.c], a)); gr.addColorStop(sharp ? .55 : .3, rgba(palette[p.c], a * .6)); gr.addColorStop(1, rgba(palette[p.c], 0));
    x.fillStyle = gr; x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill();
  }
  x.globalCompositeOperation = 'source-over';
}

// 霧窗的字要怎麼排：中文短句直排 (像寫在窗上)，其他橫排
function fogLayout(l, w, h){
  const chars = [];
  for (const wd of l.words){
    const arr = [...wd.s];
    arr.forEach((c, j) => chars.push({c, t: wd.t + wd.d * j / arr.length}));
  }
  const vis = chars.filter(c => c.c.trim());
  const cjkOnly = vis.length && vis.every(c => CJK.test(c.c) || /[，。、！？,.!?]/.test(c.c));
  let fs = Math.min(w, h) * .115 * opt.size;
  if (cjkOnly && vis.length <= 20){  // 直排：整欄要放得進畫面
    const per = vis.length > 7 ? Math.ceil(vis.length / 2) : vis.length;
    fs = Math.min(fs, h * .72 / (per * 1.08), w * .3);
  }
  const out = [];
  if (cjkOnly && vis.length <= 20){
    const perCol = vis.length > 7 ? Math.ceil(vis.length / 2) : vis.length;
    const cols = Math.ceil(vis.length / perCol);
    const x0 = w / 2 + (cols - 1) * fs * .75;
    vis.forEach((c, k) => {
      const col = Math.floor(k / perCol), row = k % perCol;
      out.push({...c, x: x0 - col * fs * 1.5, y: h / 2 - (perCol - 1) * fs * 1.08 / 2 + row * fs * 1.08, fs});
    });
  } else {
    const font = `900 ${fs}px ${FONTS[opt.font] || FONTS.sans}`;
    maskX.font = font;
    const maxW = w * .82;
    const rows = [[]];
    let rw = 0;
    for (const c of chars){
      const cw = maskX.measureText(c.c).width;
      if (rw + cw > maxW && c.c === ' '){ rows.push([]); rw = 0; continue; }
      rows[rows.length - 1].push({...c, cw}); rw += cw;
    }
    rows.forEach((row, ri) => {
      const tw = row.reduce((a, c) => a + c.cw, 0);
      let x = w / 2 - tw / 2;
      for (const c of row){ out.push({...c, x: x + c.cw / 2, y: h / 2 + (ri - (rows.length - 1) / 2) * fs * 1.25, fs}); x += c.cw; }
    });
  }
  return out;
}
function drawFog(t, dt, e, b){
  // 1. 清楚的燈光 + 起霧的版本
  drawBokeh(sceneX, sceneC.width, sceneC.height, t, e, b, true);
  blurX.filter = 'blur(3px)'; blurX.drawImage(sceneC, 0, 0, blurC.width, blurC.height); blurX.filter = 'none';
  cx.imageSmoothingEnabled = true;
  cx.drawImage(blurC, 0, 0, W, H);
  cx.fillStyle = 'rgba(200,210,232,.34)'; cx.fillRect(0, 0, W, H);      // 霧的白 (濃一點，抹開的字才看得清楚)
  if (!fogGrain){                                                       // 細細的水氣顆粒
    const gc = off(); gc.width = gc.height = 256; const gx = gc.getContext('2d');
    for (let i = 0; i < 2600; i++){ gx.fillStyle = `rgba(255,255,255,${Math.random() * .22})`; gx.fillRect(Math.random() * 256, Math.random() * 256, 1.4, 1.4); }
    fogGrain = cx.createPattern(gc, 'repeat');
  }
  cx.fillStyle = fogGrain; cx.fillRect(0, 0, W, H);
  // 2. 換句：舊的字慢慢再起霧
  if (fogIdx !== fogLine || fogSize !== W + 'x' + H){
    fogSize = W + 'x' + H;
    if (fogLine >= 0 && lines[fogLine]) fogPrev = {lay: fogLayout(lines[fogLine], W, H), at: t};
    fogLine = fogIdx; fogSwitch = t;
    fogCur = fogIdx >= 0 && lines[fogIdx] ? fogLayout(lines[fogIdx], W, H) : [];
  }
  // 3. 遮罩：被抹開的字 + 水痕
  maskX.clearRect(0, 0, W, H);
  trailX.globalCompositeOperation = 'destination-out';
  trailX.fillStyle = `rgba(0,0,0,${(dt * .12).toFixed(4)})`; trailX.fillRect(0, 0, W, H);  // 水痕慢慢又起霧
  trailX.globalCompositeOperation = 'source-over';
  maskX.drawImage(trailC, 0, 0);
  const drawChars = (lay, mul) => {
    for (const c of lay){
      const a = Math.max(0, Math.min(1, (fogTT - c.t) / .45)) * mul;
      if (a <= 0) continue;
      maskX.font = `900 ${c.fs}px ${FONTS[opt.font] || FONTS.sans}`;
      maskX.textAlign = 'center'; maskX.textBaseline = 'middle';
      maskX.shadowColor = `rgba(255,255,255,${a})`; maskX.shadowBlur = c.fs * .12;
      maskX.fillStyle = `rgba(255,255,255,${a})`;
      maskX.fillText(c.c, c.x, c.y);
      if (a > .9 && !c.dripped){                       // 抹開後偶爾流下一道水
        c.dripped = true;
        if (Math.random() < .45 && c.c.trim()) drips.push({x: c.x + rnd(-.25, .25) * c.fs, y: c.y + c.fs * .45, v: rnd(18, 55) * DPR, life: rnd(2.5, 6), w: rnd(1.5, 3.2) * DPR});
      }
    }
  };
  if (fogPrev){
    const k = 1 - (t - fogPrev.at) / 2.2;
    if (k <= 0) fogPrev = null; else drawChars(fogPrev.lay, k);
  }
  drawChars(fogCur || [], 1);
  maskX.shadowBlur = 0;
  // 水滴往下流，留下清楚的痕跡
  trailX.strokeStyle = 'rgba(255,255,255,.9)'; trailX.lineCap = 'round';
  for (const d of drips){
    const y0 = d.y; d.v *= .995; d.y += d.v * dt; d.life -= dt;
    trailX.lineWidth = d.w; trailX.beginPath(); trailX.moveTo(d.x, y0); trailX.lineTo(d.x + Math.sin(d.y * .05) * .4, d.y); trailX.stroke();
  }
  drips = drips.filter(d => d.life > 0 && d.y < H);
  // 4. 透過遮罩看到清楚的燈光
  tmpX.globalCompositeOperation = 'source-over';
  tmpX.clearRect(0, 0, W, H);
  tmpX.drawImage(sceneC, 0, 0, W, H);
  tmpX.globalCompositeOperation = 'destination-in';
  tmpX.drawImage(maskC, 0, 0);
  tmpX.globalCompositeOperation = 'source-over';
  // 抹開的地方：玻璃後面比較暗、比較清楚 (先壓暗再放清楚的燈光)
  cx.save(); cx.globalCompositeOperation = 'destination-out'; cx.globalAlpha = .55; cx.drawImage(maskC, 0, 0); cx.restore();
  cx.drawImage(tmpC, 0, 0);
  cx.save(); cx.globalAlpha = .55; cx.drawImage(maskC, 0, 0); cx.restore();   // 擦乾淨的玻璃反光：字才讀得出來
  // 5. 水滴頭
  for (const d of drips){
    cx.fillStyle = 'rgba(255,255,255,.35)'; cx.beginPath(); cx.arc(d.x, d.y, d.w * 1.3, 0, 6.283); cx.fill();
  }
}
let fogCur = [], fogGrain = null, fogSize = '';

function drawRain(t, dt, e, b){
  drawBokeh(cx, W, H, t, e, b, false);
  // 地面的反光
  const g = cx.createLinearGradient(0, H * .72, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, rgba(palette[0], .18 + e * .1));
  cx.fillStyle = g; cx.fillRect(0, H * .72, W, H * .28);
  cx.lineCap = 'round';
  const wind = .18;
  for (const r of rain){
    r.y += r.v * dt * (1 + e * .5); r.x += r.v * wind * dt;
    if (r.y > H * .96){
      if (Math.random() < .25) splashes.push({x: r.x, y: H * rnd(.9, .99), r: 0, a: .5, c: r.c});
      r.y = rnd(-H * .3, 0); r.x = rnd(-W * .2, W);
    }
    cx.strokeStyle = rgba(palette[r.c], r.a); cx.lineWidth = 1.2 * DPR;
    cx.beginPath(); cx.moveTo(r.x, r.y); cx.lineTo(r.x - r.l * wind, r.y - r.l); cx.stroke();
  }
  for (const s of splashes){
    s.r += 40 * DPR * dt; s.a -= dt * 1.2;
    cx.strokeStyle = rgba(palette[s.c], s.a); cx.lineWidth = DPR;
    cx.beginPath(); cx.ellipse(s.x, s.y, s.r, s.r * .25, 0, 0, 6.283); cx.stroke();
  }
  splashes = splashes.filter(s => s.a > 0);
}

// 霓虹街：320×180 的像素城市，放大成全螢幕 (不平滑 = 像素感)
function buildCity(){
  const w = 320, h = 180;
  cityC.width = w; cityC.height = h;
  const layers = [];
  for (let L = 0; L < 3; L++){
    const bs = [];
    let x = -20;
    while (x < w * 2){
      const bw = Math.round(rnd(14, 34) - L * 3), bh = Math.round(rnd(40, 120) * (1 - L * .25) + L * 10);
      const wins = [];
      for (let wy = 6; wy < bh - 4; wy += 5) for (let wx = 3; wx < bw - 3; wx += 4) wins.push({x: wx, y: wy, on: Math.random() < .35, c: Math.random() < .7 ? 0 : 1 + Math.floor(Math.random() * 3)});
      bs.push({x, w: bw, h: bh, wins, sign: Math.random() < .25 ? {c: Math.floor(rnd(0, 4)), y: Math.round(rnd(8, Math.max(9, bh - 20))), w: Math.round(rnd(6, bw - 4))} : null});
      x += bw + Math.round(rnd(0, 4));
    }
    layers.push({bs, speed: [1.5, 4, 8][L], shade: [.45, .7, 1][L], w: x});
  }
  city = {w, h, layers, drops: Array.from({length: 90}, () => ({x: rnd(0, w), y: rnd(0, h), v: rnd(80, 140)}))};
}
function drawCity(t, dt, e, b){
  if (!city) buildCity();
  const x = cityX, {w, h} = city;
  const sky = x.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#05030f'); sky.addColorStop(.7, rgba(palette[1], .55)); sky.addColorStop(1, rgba(palette[0], .7));
  x.fillStyle = '#05030f'; x.fillRect(0, 0, w, h); x.fillStyle = sky; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(255,240,220,.85)'; x.fillRect(250, 22, 10, 10);   // 月亮
  for (let i = 0; i < 40; i++){ x.fillStyle = `rgba(255,255,255,${.3 + .3 * Math.sin(t * 2 + i)})`; x.fillRect((i * 73) % w, (i * 37) % 70, 1, 1); }
  for (const L of city.layers){
    const off = (t * L.speed) % L.w;
    for (const bd of L.bs){
      const bx = Math.round(bd.x - off + (bd.x - off < -40 ? L.w : 0));
      if (bx > w || bx + bd.w < 0) continue;
      const by = h - bd.h;
      x.fillStyle = `rgb(${Math.round(12 * L.shade)},${Math.round(10 * L.shade)},${Math.round(24 * L.shade)})`;
      x.fillRect(bx, by, bd.w, bd.h);
      for (const wn of bd.wins){
        if (L.shade < 1 && Math.random() < .0008) wn.on = !wn.on;
        if (b > .7 && Math.random() < .02) wn.on = !wn.on;               // 節拍：燈閃一閃
        if (!wn.on) continue;
        x.fillStyle = wn.c ? rgba(palette[wn.c], .9 * L.shade) : `rgba(255,214,140,${.85 * L.shade})`;
        x.fillRect(bx + wn.x, by + wn.y, 2, 2);
      }
      if (bd.sign){
        x.fillStyle = rgba(palette[bd.sign.c], (.7 + .3 * Math.sin(t * 6 + bd.x)) * L.shade);
        x.fillRect(bx + 2, by + bd.sign.y, Math.min(bd.sign.w, bd.w - 4), 3);
      }
    }
  }
  x.fillStyle = 'rgba(180,200,255,.35)';
  for (const d of city.drops){ d.y += d.v * dt; d.x -= d.v * .15 * dt; if (d.y > h){ d.y = 0; d.x = rnd(0, w + 20); } x.fillRect(Math.round(d.x), Math.round(d.y), 1, 3); }
  cx.imageSmoothingEnabled = false;
  cx.drawImage(cityC, 0, 0, W, H);
  cx.imageSmoothingEnabled = true;
  // 霓虹的光暈
  cx.globalCompositeOperation = 'lighter';
  const gl = cx.createRadialGradient(W / 2, H * .3, 0, W / 2, H * .3, W * .5);
  gl.addColorStop(0, rgba(palette[0], .12 + b * .12)); gl.addColorStop(1, 'rgba(0,0,0,0)');
  cx.fillStyle = gl; cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'source-over';
}

function drawFireworks(t, dt, e, b){
  cx.globalCompositeOperation = 'source-over';
  cx.fillStyle = 'rgba(3,3,10,.22)'; cx.fillRect(0, 0, W, H);   // 不清空 = 留下拖尾
  // 地平線的光
  const g = cx.createLinearGradient(0, H * .8, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, rgba(palette[1], .08));
  cx.fillStyle = g; cx.fillRect(0, H * .8, W, H * .2);
  if (t > nextRocket || (b > .9 && rockets.length < 4)){
    rockets.push({x: rnd(.15, .85) * W, y: H, vx: rnd(-60, 60) * DPR, vy: -rnd(780, 1050) * DPR, c: Math.floor(rnd(0, 4)), top: rnd(.15, .45) * H});
    nextRocket = t + rnd(.7, 1.6) / (1 + e);
  }
  cx.globalCompositeOperation = 'lighter';
  for (const r of rockets){
    r.x += r.vx * dt; r.y += r.vy * dt; r.vy += 420 * DPR * dt;
    cx.fillStyle = rgba(palette[r.c], .9); cx.beginPath(); cx.arc(r.x, r.y, 2.2 * DPR, 0, 6.283); cx.fill();
    if (r.y <= r.top || r.vy >= 0){
      r.done = true;
      const n = Math.round(rnd(60, 110)), sp = rnd(220, 420) * DPR, ring = Math.random() < .3;
      for (let i = 0; i < n; i++){
        const a = i / n * 6.283 + rnd(0, .1), v = ring ? sp : sp * Math.sqrt(Math.random());
        sparks.push({x: r.x, y: r.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(1.1, 2), max: 2, c: Math.random() < .8 ? r.c : (r.c + 1) % 4});
      }
    }
  }
  rockets = rockets.filter(r => !r.done);
  for (const p of sparks){
    p.vx *= .985; p.vy = p.vy * .985 + 160 * DPR * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    const a = Math.min(1, p.life / 1.2) * (.6 + .4 * Math.random());
    cx.fillStyle = rgba(palette[p.c], a); cx.beginPath(); cx.arc(p.x, p.y, 1.8 * DPR, 0, 6.283); cx.fill();
  }
  sparks = sparks.filter(p => p.life > 0);
  cx.globalCompositeOperation = 'source-over';
}

  catch { if (seq === fdSeq){ msg.className = 'msg err'; msg.textContent = '搜尋失敗，請檢查網路'; } return; }

    b.innerHTML = '<span class="src"></span><span><span class="t"></span><span class="a"></span></span><span class="d"></span>';
    b.querySelector('.src').textContent = label[c.source] || c.source;
    b.querySelector('.t').textContent = c.title;
    b.querySelector('.a').textContent = [c.artist, c.album].filter(Boolean).join(' · ') + (c.synced === false ? '　（未同步）' : '');
    const d = b.querySelector('.d'); d.textContent = c.duration ? fmt(c.duration) : '?';
    if (dur && c.duration && Math.abs(c.duration - dur) <= 3) d.classList.add('ok');
    b.onclick = async () => {
      box.querySelectorAll('button').forEach(x => x.disabled = true);
      msg.className = 'msg'; msg.textContent = '套用中…';
      try {
        const r = await (await fetch('/lyrics/use', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(c)})).json();
        if (r.ok) fd.classList.remove('open'); else { msg.className = 'msg err'; msg.textContent = r.error || '套用失敗'; }
      } catch { msg.className = 'msg err'; msg.textContent = '套用失敗'; }
      box.querySelectorAll('button').forEach(x => x.disabled = false);
    };
    box.appendChild(b);
  }
}
$('#fd-form').onsubmit = e => { e.preventDefault(); fdSearch(); };
$('#fd-x').onclick = () => fd.classList.remove('open');
fd.onclick = e => { e.stopPropagation(); if (e.target === fd) fd.classList.remove('open'); };
fd.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') fd.classList.remove('open'); });
fd.querySelectorAll('.tab').forEach(t => t.onclick = () => fdTab(t.dataset.tab));
$('#fd-file-btn').onclick = () => $('#fd-file').click();
$('#fd-file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const buf = await f.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\uFFFD')) text = new TextDecoder('big5').decode(buf);
  if (text.includes('\uFFFD')) text = new TextDecoder('gbk').decode(buf);
  $('#fd-text').value = text; $('#fd-pmsg').textContent = f.name;
};
$('#fd-apply').onclick = async () => {
  const text = $('#fd-text').value;
  if (!text.trim()){ $('#fd-pmsg').textContent = '請先貼上歌詞'; return; }
  const r = await (await fetch('/lyrics/import', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})})).json();
  if (r.ok){ fd.classList.remove('open'); $('#fd-text').value = ''; $('#fd-pmsg').textContent = ''; }
  else $('#fd-pmsg').textContent = r.error || '套用失敗';
};
$('#find').onclick = e => { e.stopPropagation(); openFind(); };
$('#nolyr-go').onclick = e => { e.stopPropagation(); openFind(); };
$('#nolyr').addEventListener('click', e => e.stopPropagation());
addEventListener('keydown', e => { if ((e.key === 'l' || e.key === 'L') && !e.ctrlKey && !e.target.closest?.('input,select,textarea')) openFind(); });
// 沒有同步歌詞 (而且 AI 也沒在寫) 時，滑鼠一動就提示可以找歌詞
setInterval(() => {
  const none = !!track && !!lyr && !lyr.loading && !lines.length && lyr.ai !== 'live';  // 沒歌詞或只有不同步的歌詞 (舞台顯示不了)
  document.body.classList.toggle('nolyr', none);
}, 500);
// 在主視窗裡打開 (?app=1)：標題維持「Hummi 哼哼」，OBS 的視窗擷取、拖曳視窗都認得同一個視窗
if (params.has('app') && !OBS){
  document.body.classList.add('inwin');
  document.title = 'Hummi 哼哼';
  const api = () => window.pywebview?.api;
  $('#tb-min').onclick = e => { e.stopPropagation(); api()?.minimize(); };
  $('#tb-max').onclick = e => { e.stopPropagation(); api()?.toggle_maximize(); };
  $('#tb-x').onclick = e => { e.stopPropagation(); api()?.hide(); };
  $('#tb .drag').addEventListener('mousedown', e => { if (e.button !== 0) return; if (e.detail >= 2){ api()?.toggle_maximize(); return; } api()?.drag(); });
  $('#tb').addEventListener('click', e => e.stopPropagation());
}
$('#home').onclick = e => { e.stopPropagation(); if (document.body.classList.contains('inwin') || !window.pywebview?.api?.back) location.href = '/?app=1'; else window.pywebview.api.back(); };
$('#gear').onclick = e => { e.stopPropagation(); $('#panel').classList.toggle('open'); };
$('#panel').onclick = e => e.stopPropagation();
addEventListener('click', () => $('#panel').classList.remove('open'));
// App 的舞台視窗用 App 自己的全螢幕 (網頁的全螢幕在 App 視窗裡沒有作用)；瀏覽器 / OBS 用網頁的
const fullscreen = () => window.pywebview?.api?.fullscreen ? window.pywebview.api.fullscreen()
  : document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
$('#b-full').onclick = fullscreen;
addEventListener('keydown', e => { if ((e.key === 'f' || e.key === 'F' || e.key === 'F11') && !e.target.closest?.('input,select')){ e.preventDefault(); fullscreen(); } if (e.key === 'Escape'){ $('#panel').classList.remove('open'); window.pywebview?.api?.exit_fullscreen?.(); } });
$('#b-obs').onclick = async () => {
  const q = new URLSearchParams({obs: 1, mode: opt.mode, bg: opt.bg, size: opt.size, nsize: opt.nsize, font: opt.font, transparent: +opt.transparent, next: +opt.next,
                                 card: +opt.card, beat: +opt.beat, album: +opt.album, color: opt.color});
  const url = `http://${location.host}/stage?${q}`;
  try { await navigator.clipboard.writeText(url); $('#msg').textContent = '已複製！在 OBS 新增「瀏覽器」來源，貼上網址，寬高設 1920×1080。之後在這裡換效果、背景，OBS 會自動跟著換，不用再複製。'; }
  catch { $('#msg').textContent = url; }
};
let uiTimer;
const poke = e => { document.body.classList.add('ui'); $('#hint').classList.add('show');
  // 音樂控制列只在滑鼠移到畫面下方 (或正在用它) 時出現，不然會一直蓋住下面那句歌詞
  const low = !e || e.clientY > innerHeight * 0.72 || e.target?.closest?.('#ctl');
  document.body.classList.toggle('ctl', !!low);
  clearTimeout(uiTimer); uiTimer = setTimeout(() => { if (!$('#panel').classList.contains('open')){ document.body.classList.remove('ui', 'ctl'); $('#hint').classList.remove('show'); } }, 2500); };
addEventListener('mousemove', poke);
document.documentElement.addEventListener('mouseleave', () => { clearTimeout(uiTimer); document.body.classList.remove('ctl');
  if (!$('#panel').classList.contains('open')){ document.body.classList.remove('ui'); $('#hint').classList.remove('show'); } });

addEventListener('resize', resize);
resize(); applyBg(); applyOpts(); renderPanel(); rebuild(); poke();
connect();
requestAnimationFrame(frame);
</script>
